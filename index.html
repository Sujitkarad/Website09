<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e6b5b"><title>Banyan Vet Hospital</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f4;--s:#fff;--s2:#e8f0ed;--ink:#13231f;--muted:#586b65;--line:#d3dfda;--a:#0e6b5b;--warn:#8f5600;--warnbg:#faebcb;--ok:#1d7439;--okbg:#d8efde}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;display:grid;grid-template-columns:210px 1fr;gap:25px}.rail{position:sticky;top:20px;align-self:start}.brand{font-size:18px;font-weight:700;margin:8px 0 25px;display:flex;gap:10px;align-items:center}.paw{color:var(--a);font-size:30px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:600}.nav button.active,.nav button:hover{background:var(--a);color:white}.main{display:grid;gap:20px;min-width:0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1,h2{font-family:'Bricolage Grotesque',sans-serif;margin:0;line-height:1.2}h1{font-size:29px}h2{font-size:18px}.muted,.sub{color:var(--muted)}.sub{font-size:12px}.btn{border:1px solid var(--line);background:var(--s);padding:8px 12px;border-radius:8px;font-weight:600;color:var(--ink)}.primary{background:var(--a);border-color:var(--a);color:white}.small{padding:5px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}.stat{background:var(--s);padding:14px}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:700}.stat b{display:block;font:700 28px 'Bricolage Grotesque'}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.panel header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pad{padding:16px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted)}tr:last-child td{border:0}.pill{display:inline-block;border-radius:99px;padding:3px 8px;font-size:12px;font-weight:700;background:var(--s2);color:var(--muted)}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.list{list-style:none;padding:0;margin:0}.list li{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.list li:last-child{border:0}.empty{padding:24px;text-align:center;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:white;color:var(--ink)}.modalback{position:fixed;inset:0;background:#071b16aa;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(570px,100%);max-height:90vh;overflow:auto;background:var(--s);border-radius:12px}.modal header{padding:14px 17px;border-bottom:1px solid var(--line)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 15px;border-radius:8px}.hidden{display:none}.foot{font-size:12px;color:var(--muted);margin-top:18px}
@media(max-width:850px){body{padding:14px}.app{grid-template-columns:1fr}.rail{position:static}.brand{margin:0 0 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;background:white;border:1px solid var(--line)}.cols{grid-template-columns:1fr}}@media(max-width:520px){h1{font-size:24px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div class="app"><aside class="rail"><div class="brand"><span class="paw">✿</span><div>Banyan Vet Hospital<small>Management system</small></div></div><nav class="nav" id="nav"></nav><p class="foot">Demo records · Saved in this browser</p><button class="btn small" id="reset">Reset sample data</button></aside><main class="main" id="main"></main></div><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const K='banyan-vet-v1',V=['Dr. Asha Rane','Dr. Vikram Bhosale','Dr. Priya Nair'],S=['Dog','Cat','Bird','Rabbit','Cattle','Goat','Horse','Other'],$=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),later=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cash=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const seed=()=>({seq:1008,patients:[['P-1001','Bruno','Dog','Labrador','Male',4,28,'Rohit Deshmukh','9876540011'],['P-1002','Misty','Cat','Persian','Female',2,3.8,'Anjali Kulkarni','9876540022'],['P-1003','Tommy','Dog','Indian Pariah','Male',6,19,'Suresh Patil','9876540033'],['P-1004','Coco','Bird','Parakeet','Female',3,.25,'Meera Joshi','9876540044'],['P-1005','Gauri','Cattle','Gir','Female',5,410,'Ganesh Pawar','9876540055'],['P-1006','Snowy','Rabbit','New Zealand White','Male',1,2.4,'Neha Shinde','9876540066'],['P-1007','Simba','Cat','Domestic','Male',7,4.6,'Imran Sheikh','9876540077'],['P-1008','Rani','Goat','Osmanabadi','Female',3,38,'Kavita More','9876540088']].map(x=>({id:x[0],name:x[1],species:x[2],breed:x[3],sex:x[4],age:x[5],weight:x[6],owner:x[7],phone:x[8]})),appointments:[{id:'A-5001',patientId:'P-1001',date:today(),time:'09:30',vet:V[0],reason:'Annual booster vaccination',status:'Completed'},{id:'A-5002',patientId:'P-1002',date:today(),time:'10:15',vet:V[2],reason:'Skin rash and itching',status:'Checked in'},{id:'A-5003',patientId:'P-1005',date:today(),time:'11:00',vet:V[1],reason:'Reduced milk yield',status:'Scheduled'},{id:'A-5004',patientId:'P-1004',date:today(),time:'12:30',vet:V[2],reason:'Feather plucking',status:'Scheduled'},{id:'A-5005',patientId:'P-1003',date:later(1),time:'10:00',vet:V[0],reason:'Wound follow-up',status:'Scheduled'}],records:[{id:'R-3001',patientId:'P-1007',date:later(-3),vet:V[0],complaint:'Vomiting and low appetite',diagnosis:'Acute gastritis',treatment:'IV fluids, anti-emetic injection and bland diet',followUp:later(4)}],inventory:[{id:'I-1',name:'Amoxicillin 250 mg',category:'Antibiotic',stock:140,unit:'tablets',reorder:50,expiry:later(420),price:12},{id:'I-2',name:'Rabies vaccine',category:'Vaccine',stock:6,unit:'vials',reorder:10,expiry:later(150),price:350},{id:'I-3',name:'DHPPi vaccine',category:'Vaccine',stock:18,unit:'vials',reorder:10,expiry:later(210),price:550},{id:'I-4',name:'Ivermectin injection',category:'Antiparasitic',stock:9,unit:'bottles',reorder:5,expiry:later(40),price:180},{id:'I-5',name:'Meloxicam',category:'Analgesic',stock:22,unit:'bottles',reorder:8,expiry:later(330),price:220},{id:'I-6',name:'Albendazole suspension',category:'Antiparasitic',stock:4,unit:'bottles',reorder:6,expiry:later(270),price:140},{id:'I-7',name:'Normal saline 500 ml',category:'Fluids',stock:31,unit:'bags',reorder:15,expiry:later(500),price:60},{id:'I-8',name:'Sterile gauze rolls',category:'Supplies',stock:12,unit:'rolls',reorder:20,expiry:later(700),price:25}],invoices:[{id:'INV-2041',patientId:'P-1001',date:today(),items:[{desc:'Consultation',amt:500},{desc:'Vaccination',amt:700}],paid:false},{id:'INV-2042',patientId:'P-1007',date:later(-3),items:[{desc:'Consultation',amt:500},{desc:'IV fluids',amt:850}],paid:true},{id:'INV-2043',patientId:'P-1003',date:later(-9),items:[{desc:'Consultation',amt:500},{desc:'Wound suturing',amt:1800}],paid:true}]});
let db;try{db=JSON.parse(localStorage.getItem(K))||seed()}catch{db=seed()}const save=()=>localStorage.setItem(K,JSON.stringify(db)),pet=id=>db.patients.find(p=>p.id===id)||{name:'Unknown'},total=i=>i.items.reduce((s,x)=>s+ +x.amt,0);let view='dashboard',q='';
const tabs=['dashboard','patients','appointments','records','pharmacy','billing'],names=['Dashboard','Patients','Appointments','Visit records','Pharmacy','Billing'];
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
function button(t,a,cl=''){return '<button class="btn '+cl+'" data-a="'+a+'">'+t+'</button>'}
function top(t,d,b=''){return '<div class="head"><div><h1>'+t+'</h1><div class="muted">'+d+'</div></div>'+b+'</div>'}
function pill(t){return '<span class="pill '+(t==='Completed'||t==='Paid'?'ok':t==='Checked in'||t==='Low stock'?'warn':'')+'">'+esc(t)+'</span>'}
function table(h,rows){return '<div class="tablewrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function render(){ $('#nav').innerHTML=tabs.map((x,i)=>'<button data-tab="'+x+'" class="'+(view===x?'active':'')+'">'+names[i]+'</button>').join('');({dashboard,patients,appointments,records,pharmacy,billing}[view])()}
function dashboard(){let a=db.appointments.filter(x=>x.date===today()),u=db.invoices.filter(x=>!x.paid),low=db.inventory.filter(x=>x.stock<=x.reorder);$('#main').innerHTML=top('Good day, team','Hospital overview · '+today(),button('+ New appointment','new-appt','primary'))+'<div class="stats"><div class="stat"><small>Registered patients</small><b>'+db.patients.length+'</b></div><div class="stat"><small>Today appointments</small><b>'+a.length+'</b></div><div class="stat"><small>Pending invoices</small><b>'+u.length+'</b><span class="sub">'+cash(u.reduce((s,i)=>s+total(i),0))+' outstanding</span></div><div class="stat"><small>Low stock alerts</small><b>'+low.length+'</b></div></div><div class="cols"><section class="panel"><header><h2>Today&#39;s appointments</h2>'+button('View all','tab:appointments','small')+'</header>'+(a.length?'<ul class="list">'+a.sort((x,y)=>x.time.localeCompare(y.time)).map(x=>'<li><div><b>'+esc(pet(x.patientId).name)+'</b><div class="sub">'+esc(x.reason)+' · '+esc(x.vet)+'</div></div><div>'+x.time+'<br>'+pill(x.status)+'</div></li>').join('')+'</ul>':'<div class="empty">No appointments today</div>')+'</section><section class="panel"><header><h2>Inventory alerts</h2>'+button('Pharmacy','tab:pharmacy','small')+'</header>'+(low.length?'<ul class="list">'+low.map(x=>'<li>'+esc(x.name)+' '+pill('Low stock')+'</li>').join('')+'</ul>':'<div class="empty">Stock levels look good</div>')+'</section></div><section class="panel"><header><h2>Patient directory</h2>'+button('View patients','tab:patients','small')+'</header>'+table(['Patient','Species','Owner','Contact'],db.patients.slice(0,5).map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="sub">'+p.id+'</div></td><td>'+p.species+'</td><td>'+esc(p.owner)+'</td><td>'+p.phone+'</td></tr>'))+'</section>'}
function patients(){let a=db.patients.filter(p=>(p.name+p.owner+p.species+p.id).toLowerCase().includes(q.toLowerCase()));$('#main').innerHTML=top('Patients','Patient profiles and owner information',button('+ Add patient','new-patient','primary'))+'<section class="panel"><header><h2>Patient directory</h2><input id="search" placeholder="Search patients…" value="'+esc(q)+'" style="max-width:280px"></header>'+table(['Patient','Species / breed','Sex','Age','Weight','Owner','Phone',''],a.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="sub">'+p.id+'</div></td><td>'+p.species+' / '+esc(p.breed)+'</td><td>'+p.sex+'</td><td>'+p.age+' yr</td><td>'+p.weight+' kg</td><td>'+esc(p.owner)+'</td><td>'+p.phone+'</td><td>'+button('Edit','edit-p:'+p.id,'small')+'</td></tr>'))+'</section>'}
function appointments(){let a=db.appointments.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));$('#main').innerHTML=top('Appointments','Schedule and manage consultations',button('+ New appointment','new-appt','primary'))+'<section class="panel"><header><h2>Appointment schedule</h2><span class="sub">'+a.length+' records</span></header>'+table(['Date','Time','Patient','Reason','Veterinarian','Status','Action'],a.map(x=>'<tr><td>'+x.date+'</td><td>'+x.time+'</td><td>'+esc(pet(x.patientId).name)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.vet)+'</td><td>'+pill(x.status)+'</td><td>'+(x.status!=='Completed'&&x.status!=='Cancelled'?button('Advance','advance:'+x.id,'small'):'')+'</td></tr>'))+'</section>'}
function records(){let a=db.records.slice().reverse();$('#main').innerHTML=top('Visit records','Clinical notes, diagnosis and follow-up history',button('+ Add visit record','new-record','primary'))+'<section class="panel"><header><h2>Clinical history</h2></header>'+(a.length?'<div class="pad">'+a.map(x=>'<p><b>'+esc(pet(x.patientId).name)+' · '+x.date+'</b> <span class="sub">'+esc(x.vet)+'</span><br><b>Complaint:</b> '+esc(x.complaint)+'<br><b>Diagnosis:</b> '+esc(x.diagnosis)+'<br><b>Treatment:</b> '+esc(x.treatment)+'<br><span class="sub">Follow-up: '+(x.followUp||'Not scheduled')+'</span><hr style="border:0;border-top:1px solid var(--line)"></p>').join('')+'</div>':'<div class="empty">No visit records</div>')+'</section>'}
function pharmacy(){let a=db.inventory;$('#main').innerHTML=top('Pharmacy & inventory','Medicine stock, expiry and reorder monitoring',button('+ Add item','new-item','primary'))+'<section class="panel"><header><h2>Inventory</h2><span class="sub">'+a.filter(x=>x.stock<=x.reorder).length+' low-stock alerts</span></header>'+table(['Item','Category','Stock','Reorder','Expiry','Price','Status',''],a.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+x.category+'</td><td>'+x.stock+' '+x.unit+'</td><td>'+x.reorder+'</td><td>'+x.expiry+'</td><td>'+cash(x.price)+'</td><td>'+pill(x.stock<=x.reorder?'Low stock':'In stock')+'</td><td>'+button('Edit','edit-i:'+x.id,'small')+'</td></tr>'))+'</section>'}
function billing(){let a=db.invoices.slice().reverse(),un=a.filter(x=>!x.paid);$('#main').innerHTML=top('Billing','Invoices, payments and outstanding balances',button('+ Create invoice','new-invoice','primary'))+'<div class="stats"><div class="stat"><small>Total billed</small><b>'+cash(a.reduce((s,x)=>s+total(x),0))+'</b></div><div class="stat"><small>Collected</small><b>'+cash(a.filter(x=>x.paid).reduce((s,x)=>s+total(x),0))+'</b></div><div class="stat"><small>Outstanding</small><b>'+cash(un.reduce((s,x)=>s+total(x),0))+'</b></div><div class="stat"><small>Invoices</small><b>'+a.length+'</b></div></div><section class="panel"><header><h2>Invoice register</h2></header>'+table(['Invoice','Date','Patient','Items','Total','Payment',''],a.map(x=>'<tr><td>'+x.id+'</td><td>'+x.date+'</td><td>'+esc(pet(x.patientId).name)+'</td><td>'+x.items.length+'</td><td>'+cash(total(x))+'</td><td>'+pill(x.paid?'Paid':'Pending')+'</td><td>'+(x.paid?'':button('Mark paid','paid:'+x.id,'small'))+'</td></tr>'))+'</section>'}
function open(title,fields,action){$('#modal').innerHTML='<div class="modalback"><section class="modal"><header><h2>'+title+'</h2></header><div class="pad"><form id="form" data-save="'+action+'"><div class="formgrid">'+fields+'</div><div class="actions"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn primary">Save</button></div></form></div></section></div>'}
function f(label,name,val='',type='text'){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(val)+'" required></div>'}
function sel(label,name,opts,val){return '<div class="field"><label>'+label+'</label><select name="'+name+'">'+opts.map(x=>'<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'}
function patientForm(p={}){open(p.id?'Edit patient':'Add patient',f('Patient name','name',p.name)+sel('Species','species',S,p.species||'Dog')+f('Breed','breed',p.breed)+sel('Sex','sex',['Male','Female','Unknown'],p.sex||'Unknown')+f('Age (years)','age',p.age||0,'number')+f('Weight (kg)','weight',p.weight||0,'number')+f('Owner name','owner',p.owner)+f('Phone','phone',p.phone,'tel'),'patient'+(p.id?':'+p.id:''))}
function apptForm(){open('New appointment','<div class="field"><label>Patient</label><select name="patientId">'+db.patients.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>'+f('Date','date',today(),'date')+f('Time','time','10:00','time')+sel('Veterinarian','vet',V,V[0])+f('Reason','reason'),'appt')}
function recordForm(){open('New visit record','<div class="field"><label>Patient</label><select name="patientId">'+db.patients.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>'+sel('Veterinarian','vet',V,V[0])+f('Visit date','date',today(),'date')+f('Follow-up','followUp','','date')+f('Complaint','complaint')+f('Diagnosis','diagnosis')+'<div class="field full"><label>Treatment / plan</label><textarea name="treatment" required></textarea></div>','record')}
function itemForm(i={}){open(i.id?'Edit inventory item':'Add inventory item',f('Item name','name',i.name)+sel('Category','category',['Antibiotic','Vaccine','Antiparasitic','Analgesic','Fluids','Supplies'],i.category||'Supplies')+f('Stock quantity','stock',i.stock||0,'number')+f('Unit','unit',i.unit||'units')+f('Reorder level','reorder',i.reorder||5,'number')+f('Expiry date','expiry',i.expiry||later(365),'date')+f('Unit price (₹)','price',i.price||0,'number'),'item'+(i.id?':'+i.id:''))}
function invoiceForm(){open('Create invoice','<div class="field"><label>Patient</label><select name="patientId">'+db.patients.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>'+f('Invoice date','date',today(),'date')+f('Service / item','desc','Consultation')+f('Amount (₹)','amt',500,'number'),'invoice')}
function saveForm(form){let d=Object.fromEntries(new FormData(form)),act=form.dataset.save;if(act.startsWith('patient')){let id=act.split(':')[1],p=id?db.patients.find(x=>x.id===id):{id:'P-'+(++db.seq)};Object.assign(p,d,{age:+d.age,weight:+d.weight});if(!id)db.patients.push(p)}if(act==='appt')db.appointments.push({...d,id:'A-'+Date.now(),status:'Scheduled'});if(act==='record')db.records.push({...d,id:'R-'+Date.now()});if(act.startsWith('item')){let id=act.split(':')[1],p=id?db.inventory.find(x=>x.id===id):{id:'I-'+Date.now()};Object.assign(p,d,{stock:+d.stock,reorder:+d.reorder,price:+d.price});if(!id)db.inventory.push(p)}if(act==='invoice')db.invoices.push({id:'INV-'+Date.now(),patientId:d.patientId,date:d.date,items:[{desc:d.desc,amt:+d.amt}],paid:false});save();$('#modal').innerHTML='';toast('Saved successfully');render()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){view=t.dataset.tab;q='';render();return}let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a;if(a==='close'){$('#modal').innerHTML='';return}if(a.startsWith('tab:')){view=a.slice(4);render();return}if(a==='new-patient'){patientForm();return}if(a==='new-appt'){apptForm();return}if(a==='new-record'){recordForm();return}if(a==='new-item'){itemForm();return}if(a==='new-invoice'){invoiceForm();return}if(a.startsWith('edit-p:')){patientForm(db.patients.find(x=>x.id===a.slice(7)));return}if(a.startsWith('edit-i:')){itemForm(db.inventory.find(x=>x.id===a.slice(7)));return}if(a.startsWith('advance:')){let x=db.appointments.find(x=>x.id===a.slice(8));x.status=({'Scheduled':'Checked in','Checked in':'In consultation','In consultation':'Completed'})[x.status]||'Completed';save();render();toast('Appointment updated');return}if(a.startsWith('paid:')){db.invoices.find(x=>x.id===a.slice(5)).paid=true;save();render();toast('Invoice marked paid')}});
document.addEventListener('submit',e=>{if(e.target.id==='form'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;let p=e.target.selectionStart;patients();$('#search').focus();$('#search').setSelectionRange(p,p)}});
$('#reset').onclick=()=>{if(confirm('Restore original sample data?')){db=seed();save();render();toast('Sample data restored')}};
render();
})();
</script></body></html>
